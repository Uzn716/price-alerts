# ─────────────────────────────────────────────────────────────────────────────
#  PC Price Alerts — your settings and watchlist
#  Edit this file right on GitHub (pencil icon), then "Commit changes".
#  The next check (within ~5 minutes) uses your new settings.
# ─────────────────────────────────────────────────────────────────────────────

settings:
  # How far below its normal price something must be to count as a price error.
  # Used for parts in your list below (each part can override it).
  min_drop_percent: 35

  # Stricter bar for PC parts that AREN'T in your list but match
  # general_keywords (so you still hear about a random 60%-off motherboard).
  general_min_drop_percent: 50

  # Ignore anything cheaper than this (filters out cables, stickers, etc.).
  min_price: 25

  # AUTOMATIC TARGETS: the bot remembers every price it sees for each part
  # and alerts when a deal beats the lowest price of the last
  # learn_window_days by at least beat_low_percent. It needs learn_min_days
  # days of prices for a part before this kicks in. Set beat_low_percent: 0
  # to turn it off.
  beat_low_percent: 10
  learn_window_days: 30
  learn_min_days: 3

  # Don't repeat an alert for the same listing for this many hours
  # (unless the price drops another 5% or more).
  realert_after_hours: 24

  # Who to ping. Leave "" for no ping. Use "@here", or "<@YOUR_USER_ID>"
  # to ping just you (README explains how to find your user ID).
  mention: ""

  general_keywords:
    - graphics card
    - geforce
    - radeon
    - ryzen
    - core ultra
    - core i9
    - core i7
    - core i5
    - motherboard
    - ddr5
    - ddr4
    - nvme
    - power supply
    - cpu cooler
    - liquid cooler
    - gaming monitor
    - pc case
    - mid tower

  # Titles containing any of these are skipped (unless you watch the exact ASIN).
  exclude:
    - laptop
    - notebook
    - chromebook
    - tablet
    - renewed
    - refurbished
    - open box
    - pre owned
    - for parts
    - water block
    - waterblock
    - backplate
    - gpu bracket
    - gpu support
    - riser
    - replacement fan

# ─────────────────────────────────────────────────────────────────────────────
#  Your watchlist. For each part:
#    match:        words that must ALL appear in a product title (case doesn't
#                  matter). Give several lines to allow alternatives.
#    exclude:      words that rule a title out (e.g. "ti" so a 5070 search
#                  doesn't catch 5070 Ti cards).
#    alert_below:  OPTIONAL. Always alert under this price. You don't need it:
#                  the bot learns each part's lowest price by itself (see
#                  beat_low_percent above). The few numbers below are examples.
#    amazon:       optional Amazon links/ASINs to watch directly (needs Keepa).
#    min_drop_percent / min_price: optional per-part overrides.
